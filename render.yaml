services:
  - type: web
    name: turtle-soup
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python import_bank.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_BASE_URL
        value: https://api.deepseek.com/v1
      - key: OPENAI_MODEL
        value: deepseek-v4.1-flash-expires-on-0910
      - key: OPENAI_API_KEY
        sync: false
