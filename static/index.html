<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>海龟汤 · 开一锅</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body class="center-page">
  <main class="card">
    <div class="logo">🥣</div>
    <h1>海龟汤</h1>
    <p class="sub">和朋友在同一个房间，靠提问还原真相</p>

    <label class="field">
      <span>你的昵称</span>
      <input id="name" maxlength="12" placeholder="例如：福尔摩斯" />
    </label>

    <button id="enterBtn" class="btn primary">进入房间</button>

    <details class="advanced">
      <summary>创建独立房间 / 房间码加入（备用）</summary>
      <button id="createBtn" class="btn">创建独立房间</button>
      <div class="join-row">
        <input id="code" maxlength="4" placeholder="房间码" autocapitalize="characters" />
        <button id="joinBtn" class="btn">加入</button>
      </div>
    </details>

    <p class="tip">把链接发到微信群，好友点开填个昵称就进同一房间</p>
    <p class="tip" id="bankTip"></p>
    <p id="error" class="error"></p>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const nameInput = $("name");
nameInput.value = localStorage.getItem("ts_name") || "";

fetch("/healthz")
  .then((r) => r.json())
  .then((d) => {
    $("bankTip").textContent = `内置题库 ${d.puzzles} 道，无主题时优先出题库题`;
    window.__defaultRoom = d.default_room || "HALL";
  })
  .catch(() => { window.__defaultRoom = "HALL"; });

function getName() {
  const n = (nameInput.value || "").trim().slice(0, 12) || "汤友";
  localStorage.setItem("ts_name", n);
  return n;
}

function enterRoom() {
  getName();
  location.href = `/r/${window.__defaultRoom || "HALL"}`;
}

async function createRoom() {
  $("error").textContent = "";
  try {
    const res = await fetch("/api/rooms", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: getName() }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "创建失败");
    location.href = `/r/${data.code}`;
  } catch (e) {
    $("error").textContent = e.message;
  }
}

function joinRoom() {
  const code = ($("code").value || "").trim().toUpperCase();
  if (!/^[A-Z0-9]{4}$/.test(code)) {
    $("error").textContent = "请输入 4 位房间码";
    return;
  }
  getName();
  location.href = `/r/${code}`;
}

$("enterBtn").onclick = enterRoom;
$("createBtn").onclick = createRoom;
$("joinBtn").onclick = joinRoom;
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") joinRoom(); });
nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") enterRoom(); });
</script>
</body>
</html>
